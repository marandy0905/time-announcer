<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>times up!</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="times up!">
<style>
  :root {
    --bg: #f2f2f7;
    --card: rgba(255, 255, 255, 0.72);
    --card-border: rgba(255, 255, 255, 0.6);
    --text: #1c1c1e;
    --text-2: #6e6e73;
    --track: rgba(60, 60, 67, 0.12);
    --fill: rgba(120, 120, 128, 0.16);
    --blue: #0a84ff;
    --orange: #ff9f0a;
    --green: #30d158;
    --red: #ff453a;
    --accent: var(--blue);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000;
      --card: rgba(44, 44, 46, 0.66);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f5f5f7;
      --text-2: #98989f;
      --track: rgba(235, 235, 245, 0.14);
      --fill: rgba(120, 120, 128, 0.32);
    }
  }
  @media (prefers-contrast: more) { :root { --card: var(--bg); --card-border: var(--text-2); } }
  @media (prefers-reduced-transparency: reduce) { .card { background: var(--bg) !important; backdrop-filter: none !important; } }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; } /* no double-tap zoom */
  html, body { min-height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 100%/1.5 system-ui, -apple-system, "SF Pro Text", "PingFang TC", sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display: flex; justify-content: center;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(60% 50% at 50% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%);
    transition: background 0.8s ease;
  }
  main { position: relative; width: min(100%, 26rem); display: grid; gap: 1rem; align-content: start; }
  .card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 1.75rem;
    backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
  }
  .locked { opacity: 0.5; pointer-events: none; }
  [hidden] { display: none !important; }

  /* ---------- Dial: three lines, the difference is the hero ---------- */
  .dial { padding: 0.6rem 1.25rem 1.25rem; text-align: center; }
  .line { padding: 0.95rem 0; }
  .line + .line { border-top: 1px solid var(--track); }
  .line small { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-2); letter-spacing: 0.02em; }
  .val { display: block; font-size: 1.9rem; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; transition: color 0.5s ease; }
  /* the highlighted line: the difference in "countdown" mode, the target in "clock" mode */
  .line.hero { padding: 1.15rem 0 1.05rem; }
  .line.hero small { color: var(--accent); font-weight: 600; font-size: 0.95rem; transition: color 0.5s ease; }
  .line.hero .val { font-size: clamp(3.2rem, 17vw, 4.6rem); line-height: 1.05; letter-spacing: -0.035em; color: var(--accent); }
  .line.hero .val.long { font-size: clamp(2.6rem, 13.5vw, 3.8rem); }
  .val i { font-style: normal; font-size: 0.5em; font-weight: 500; margin: 0 0.3em 0 0.1em; opacity: 0.6; letter-spacing: 0; }
  .val i:last-child { margin-right: 0; }
  .val i.ap { font-size: 0.42em; margin-right: 0.35em; opacity: 0.75; }
  .note { display: block; font-size: 0.85rem; color: var(--text-2); }
  .line.hero .note { min-height: 1.3em; margin-top: 0.1rem; }
  .controls { display: flex; justify-content: center; gap: 0.75rem; margin-top: 0.7rem; }
  .btn {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 1.05rem;
    min-width: 7rem; padding: 0.85rem 1.5rem; border-radius: 999px; background: var(--fill); color: var(--text);
    transition: transform 120ms ease-out, opacity 120ms ease-out, background-color 0.3s;
  }
  .btn:active { transform: scale(0.96); opacity: 0.8; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn:disabled { opacity: 0.35; pointer-events: none; }
  .btn:focus-visible, .col:focus-visible, .seg button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }

  /* ---------- Settings ---------- */
  .panel { padding: 1rem 1.25rem; --ih: 44px; }
  .panel h2 { margin: 0 0 0.6rem; font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; }
  .group { padding: 0.8rem 0; }
  .group + .group { border-top: 1px solid var(--track); }
  .group:last-child { padding-bottom: 0.2rem; }
  .group + .group.joined { border-top: 0; padding-top: 0; }   /* part of the previous group */
  .group:has(+ .group.joined:not([hidden])) { padding-bottom: 0.55rem; }
  .group .label { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; margin-bottom: 0.45rem; }
  .group .label b { font-weight: 600; font-size: 0.95rem; }
  .group .label small { color: var(--text-2); font-size: 0.78rem; }
  .seg { display: flex; gap: 2px; padding: 2px; background: var(--fill); border-radius: 0.7rem; }
  .seg button {
    flex: 1; min-width: 0; appearance: none; border: 0; cursor: pointer; font: inherit; font-size: 0.85rem; font-weight: 500;
    padding: 0.45rem 0.1rem; border-radius: 0.55rem; background: transparent; color: var(--text);
    transition: background-color 0.25s, color 0.25s, transform 100ms ease-out; white-space: nowrap;
  }
  .seg button:active { transform: scale(0.95); }
  .seg button[aria-pressed="true"] { background: var(--card-solid, #fff); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  :root { --card-solid: #fff; }
  @media (prefers-color-scheme: dark) { :root { --card-solid: #636366; } }
  .seg.mode { margin-bottom: 0.4rem; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.6rem; }
  .panel-head h2 { margin: 0; }
  .seg.mini { flex: none; }
  .seg.mini button { flex: none; padding: 0.3rem 0.7rem; font-size: 0.8rem; }
  .sep { align-self: center; height: var(--ih); line-height: var(--ih); font-size: 1.5rem; font-weight: 600; margin: 0 -0.2rem; position: relative; }

  /* Wheel picker (native scroll-snap) */
  .wheel { position: relative; display: flex; justify-content: center; gap: 0.5rem; padding: 0.25rem 0 0.25rem; }
  .wheel::before {
    content: ""; position: absolute; left: 0; right: 0; top: calc(0.25rem + var(--ih) * 2); height: var(--ih);
    background: var(--fill); border-radius: 0.7rem;
  }
  .col {
    position: relative; width: 4rem; height: calc(var(--ih) * 5); padding-block: calc(var(--ih) * 2);
    overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain;
    touch-action: pan-y; cursor: grab; outline-offset: -2px; border-radius: 0.7rem;
    -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent);
            mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent);
  }
  .col::-webkit-scrollbar { display: none; }
  .opt {
    height: var(--ih); scroll-snap-align: center; scroll-snap-stop: always;
    display: flex; align-items: center; justify-content: center; gap: 0.2rem;
    font-size: 1.35rem; font-variant-numeric: tabular-nums; color: var(--text-2); transition: color 0.15s;
  }
  .opt small { font-size: 0.8rem; font-weight: 500; }
  .col.wide { width: 4.6rem; }
  .opt.sel { color: var(--text); font-weight: 600; }
  .optnote { margin: 0.5rem 0 0; font-size: 0.78rem; line-height: 1.45; color: var(--text-2); }
  .hint { margin: 0.4rem 0 0; text-align: center; font-size: 0.8rem; color: var(--text-2); min-height: 1.2em; }

  /* podcast */
  .pod-form { display: flex; gap: 0.5rem; margin: 0.2rem 0 0.2rem; }
  .pod-form input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--text); background: var(--fill);
    border: 0; border-radius: 0.8rem; padding: 0.6rem 0.85rem; outline: none; -webkit-appearance: none;
  }
  .pod-form input::placeholder { color: var(--text-2); }
  .pod-form input:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); }
  .pod-form button, .pod-back {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-size: 0.9rem; font-weight: 600;
    padding: 0.55rem 1rem; border-radius: 0.8rem; background: var(--fill); color: var(--blue);
    transition: transform 120ms ease-out, opacity 120ms;
  }
  .pod-form button:active, .pod-back:active { transform: scale(0.95); opacity: 0.7; }
  .recent { display: flex; gap: 0.5rem; overflow-x: auto; padding: 0.7rem 0 0.2rem; scrollbar-width: none; }
  .recent::-webkit-scrollbar { display: none; }
  .recent button {
    flex: none; display: flex; align-items: center; gap: 0.45rem; appearance: none; border: 0; cursor: pointer; font: inherit; font-size: 0.85rem;
    color: var(--text); background: var(--fill); border-radius: 999px; padding: 0.3rem 0.8rem 0.3rem 0.3rem; max-width: 12rem;
    transition: transform 100ms ease-out;
  }
  .recent button:active { transform: scale(0.95); }
  .recent button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent img { width: 1.6rem; height: 1.6rem; border-radius: 50%; object-fit: cover; background: var(--track); }
  .plist { margin-top: 0.5rem; }
  .prow {
    display: flex; align-items: center; gap: 0.75rem; width: 100%; text-align: left; appearance: none; border: 0; background: none;
    color: inherit; font: inherit; padding: 0.6rem 0; cursor: pointer; border-top: 1px solid var(--track); transition: opacity 100ms;
  }
  .prow:active { opacity: 0.5; }
  .prow img { flex: none; width: 3rem; height: 3rem; border-radius: 0.7rem; object-fit: cover; background: var(--track); }
  .prow .t { min-width: 0; }
  .prow b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; font-size: 0.95rem; line-height: 1.3; }
  .prow small { display: block; color: var(--text-2); font-size: 0.78rem; margin-top: 0.1rem; }
  .prow.now b { color: var(--accent); }
  .pnote { margin: 0.6rem 0 0.2rem; color: var(--text-2); font-size: 0.85rem; }
  .pod-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: 0.5rem; }
  .pod-head b { font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pod-player { background: var(--fill); border-radius: 1.1rem; padding: 0.8rem; margin: 0.1rem 0 0.7rem; }
  .pp-top { display: flex; gap: 0.7rem; align-items: center; }
  .pp-top img { flex: none; width: 3.2rem; height: 3.2rem; border-radius: 0.8rem; object-fit: cover; background: var(--track); }
  .pp-top .t { min-width: 0; }
  .pp-top b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 0.92rem; line-height: 1.3; font-weight: 600; }
  .pp-top small { color: var(--text-2); font-size: 0.78rem; }
  .pp-bar { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.6rem; font-size: 0.75rem; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .pp-bar input { flex: 1; min-width: 0; accent-color: var(--blue); }
  .pp-ctl { display: flex; justify-content: center; align-items: center; gap: 0.6rem; margin-top: 0.4rem; }
  .pp-ctl button {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 0.85rem; color: var(--text);
    background: var(--track); border-radius: 999px; min-width: 3.1rem; height: 2.6rem; padding: 0 0.7rem;
    display: grid; place-items: center; transition: transform 100ms ease-out, opacity 100ms;
  }
  .pp-ctl button:active { transform: scale(0.92); opacity: 0.7; }
  .pp-ctl .big { width: 3.6rem; height: 3.6rem; padding: 0; background: var(--blue); color: #fff; }
  .pp-ctl svg { width: 1.3rem; height: 1.3rem; fill: currentColor; }

  /* audio-interrupted banner */
  .fix {
    position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.5rem 0.6rem 1.25rem; border-radius: 999px;
    font-size: 0.95rem; font-weight: 500; background: var(--card); border: 1px solid var(--card-border);
    backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); transform: translate(-50%, 220%); pointer-events: none;
    transition: transform 0.45s cubic-bezier(0.32, 0.72, 0, 1); z-index: 5; white-space: nowrap;
  }
  .fix.show { transform: translate(-50%, 0); pointer-events: auto; }
  .fix button {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; color: #fff; background: var(--orange);
    padding: 0.5rem 1rem; border-radius: 999px; transition: transform 100ms ease-out;
  }
  .fix button:active { transform: scale(0.94); }

  /* disclosure */
  .disclose {
    appearance: none; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0;
  }
  .disclose .label { margin: 0; display: block; }
  .disclose .label b { display: block; }
  .disclose:active .chev { transform: scale(0.85); }
  .chev {
    flex: none; width: 0.6rem; height: 0.6rem; border-right: 2px solid var(--text-2); border-bottom: 2px solid var(--text-2);
    transform: rotate(45deg); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); margin-right: 0.3rem;
  }
  .open > .disclose .chev { transform: rotate(225deg); }
  .collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s cubic-bezier(0.32, 0.72, 0, 1); }
  .open > .collapse { grid-template-rows: 1fr; }
  .collapse-inner { overflow: hidden; min-height: 0; }
  .sub { padding-top: 0.9rem; }
  .sub .label b { font-weight: 500; font-size: 0.88rem; }

  /* duration buttons */
  .dur-total { display: flex; align-items: center; justify-content: space-between; padding: 0.2rem 0.1rem 0.7rem; }
  .dur-total b { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .dur-total b.empty { color: var(--text-2); font-weight: 500; font-size: 1.05rem; }
  .clear {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-size: 0.9rem; font-weight: 600;
    padding: 0.4rem 0.95rem; border-radius: 999px; background: var(--fill); color: var(--accent);
    transition: transform 120ms ease-out, opacity 120ms ease-out;
  }
  .clear:active { transform: scale(0.95); opacity: 0.7; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
  .chip {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 0.95rem;
    padding: 0.8rem 0; border-radius: 0.9rem; background: var(--fill); color: var(--text);
    transition: transform 100ms ease-out, background-color 150ms; font-variant-numeric: tabular-nums;
  }
  .chip:active { transform: scale(0.92); background: color-mix(in srgb, var(--blue) 35%, var(--fill)); }
  .chip:focus-visible, .clear:focus-visible, .disclose:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation: none !important; } }
</style>
</head>
<body>
<main>
  <section class="card dial" aria-live="off">
    <div class="line">
      <small>現在時間</small>
      <b class="val" id="nowT">--:--</b>
    </div>
    <div class="line" id="lineDiff">
      <small id="phase">距離目標</small>
      <b class="val" id="time">00:10:00</b>
      <span class="note" id="note"> </span>
    </div>
    <div class="line" id="lineTgt">
      <small id="tgtLabel">目標時間</small>
      <b class="val" id="tgtT">--:--</b>
    </div>
    <div class="controls">
      <button class="btn" id="sec" hidden>結束</button>
      <button class="btn primary" id="main">開始</button>
    </div>
  </section>

  <section class="card panel" id="setup">
    <div class="panel-head"><h2>目標時間</h2><div class="seg mini" id="hSeg" role="group" aria-label="時間格式"></div></div>
    <div class="seg mode" id="modeSeg" role="group" aria-label="設定模式">
      <button type="button" data-v="clock">幾點幾分</button>
      <button type="button" data-v="dur">倒數多久</button>
    </div>
    <div class="wheel" id="wClock"></div>
    <div id="durBox" hidden>
      <div class="dur-total"><b id="durTotal" class="empty">尚未設定</b><button type="button" class="clear" id="durClear">清除</button></div>
      <div class="chips" id="chips"></div>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <section class="card panel" id="podcard">
    <h2>Podcast</h2>
    <div class="pod-player" id="pp" hidden>
      <div class="pp-top"><img id="ppArt" alt=""><div class="t"><b id="ppTitle"></b><small id="ppShow"></small></div></div>
      <div class="pp-bar"><span id="ppCur">0:00</span><input type="range" id="ppSeek" min="0" max="0" step="1" value="0" aria-label="播放進度"><span id="ppDur">0:00</span></div>
      <div class="pp-ctl">
        <button type="button" id="ppBack" aria-label="倒退 15 秒">−15</button>
        <button type="button" id="ppPlay" class="big" aria-label="播放"><svg viewBox="0 0 24 24" id="ppIcon"><path d="M8 5v14l11-7z"/></svg></button>
        <button type="button" id="ppFwd" aria-label="快轉 30 秒">+30</button>
        <button type="button" id="ppRate" aria-label="播放速度">1×</button>
      </div>
    </div>
    <form class="pod-form" id="podForm" role="search">
      <input type="search" id="podQ" placeholder="搜尋節目，例如：好味小姐" enterkeyhint="search" autocomplete="off">
      <button type="submit">搜尋</button>
    </form>
    <div class="recent" id="podRecent"></div>
    <div id="podHead" class="pod-head" hidden><button type="button" class="pod-back" id="podBack">‹ 返回</button><b id="podShow"></b></div>
    <div class="plist" id="podList"></div>
  </section>

  <section class="card panel" id="opts">
    <h2>語音報時</h2>
    <div id="optList"></div>
  </section>
</main>
<div class="fix" id="fix" role="alert"><span>語音被系統中斷了</span><button type="button" id="fixBtn">恢復報時</button></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const els = {
    phase: $('phase'), time: $('time'), note: $('note'), nowT: $('nowT'), tgtT: $('tgtT'),
    tgtLabel: $('tgtLabel'), main: $('main'), sec: $('sec'), setup: $('setup'), opts: $('opts'), hint: $('hint'),
  };
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const p2 = (n) => String(n).padStart(2, '0');
  const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

  /* ---------- Settings ---------- */
  const KEY = 'time-announcer-v2';
  const cfg = {
    mode: 'clock',
    sec: 10, min: 60, mid: 600, hour: 1800,   // report interval per remaining-time range, in seconds (0 = off)
    count: 10,                                 // per-second countdown starts at N seconds left (0 = off)
    cont: 'say',                               // after the target: stop | run | say
    overIv: 60,                                // seconds between 「超過…」 reports
    h24: '24',                                 // clock format: 24 | 12
    mix: 'playback',                           // playback: keeps going in the background but pauses other audio | ambient: mixes, foreground only
  };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}
  cfg.mode = 'dur';                                            // always open on 「倒數多久」
  if (cfg.mixV !== 2) { cfg.mix = 'playback'; cfg.mixV = 2; }    // iOS only keeps playing in the background with 「playback」
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch {} };

  // Not persisted: the clock picker starts at now + 10 min, the duration starts empty.
  let clockPick = [0, 0], clockTouched = false;
  let durTotal = 0;
  const MAX_DUR = 24 * 3600;
  function clockToNow() {
    const d = new Date(Date.now() + 10 * 60000);
    clockPick = [d.getHours(), d.getMinutes()];
  }
  clockToNow();

  /* ---------- Option groups ---------- */
  const O = {
    sec:  { title: '剩餘不到 1 分鐘', opts: [[0, '關閉'], [5, '5 秒'], [10, '10 秒'], [15, '15 秒'], [30, '30 秒']] },
    min:  { title: '剩餘 1–10 分鐘', opts: [[0, '關閉'], [60, '1 分'], [120, '2 分'], [300, '5 分']] },
    mid:  { title: '剩餘 10–60 分鐘', opts: [[0, '關閉'], [300, '5 分'], [600, '10 分'], [900, '15 分'], [1800, '30 分']] },
    hour: { title: '剩餘超過 1 小時', opts: [[0, '關閉'], [900, '15 分'], [1800, '30 分'], [3600, '1小時'], [7200, '2小時']] },
    count: { title: '逐秒倒數', sub: '剩下幾秒時開始唸',
      opts: [[0, '關閉'], [3, '3 秒'], [5, '5 秒'], [10, '10 秒'], [15, '15 秒'], [30, '30 秒']] },
    cont: { title: '時間到之後', sub: '要不要繼續',
      opts: [['stop', '停止'], ['run', '只計時'], ['say', '計時並報時']] },
    overIv: { title: '時間到之後報時間隔', sub: '每隔多久', when: () => cfg.cont === 'say',
      opts: [[10, '10 秒'], [30, '30 秒'], [60, '1 分'], [300, '5 分'], [600, '10 分']] },
    mix: { title: '音訊模式', sub: '',
      note: 'iOS 的限制：縮小或鎖定螢幕後還能報時，就一定會暫停其他 App 的音樂；想一邊聽音樂，App 就要留在前景。',
      opts: [['playback', '背景報時'], ['ambient', '搭配音樂']] },
  };
  const label = (k) => (O[k].opts.find(([v]) => v === cfg[k]) || [0, ''])[1];

  function segment(host, key) {
    const o = O[key];
    host.className = 'seg'; host.setAttribute('role', 'group');
    host.replaceChildren(...o.opts.map(([v, text]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = text;
      b.setAttribute('aria-pressed', String(v === cfg[key]));
      b.onclick = () => { cfg[key] = v; save(); if (key === 'mix') applyAudioSession(); renderOptions(); };
      return b;
    }));
  }
  function group(key) {
    const g = document.createElement('div');
    g.className = 'group';
    g.innerHTML = '<div class="label"><b></b><small></small></div><div class="segwrap"></div>';
    g.querySelector('b').textContent = O[key].title;
    g.querySelector('small').textContent = O[key].sub || '';
    const seg = g.querySelector('.segwrap');
    if (O[key].note) { const n = document.createElement('p'); n.className = 'optnote'; n.textContent = O[key].note; g.append(n); }
    return { key, g, seg };
  }

  // Order: per-second countdown first, then the (collapsed) report intervals, then the rest.
  const list = $('optList');
  const simple = ['count', 'cont', 'overIv', 'mix'].map(group);
  simple[2].g.classList.add('joined');
  const ivBox = document.createElement('div');
  ivBox.className = 'group';
  ivBox.innerHTML =
    '<button type="button" class="disclose" aria-expanded="false"><span class="label"><b>報時間隔</b><small id="ivSummary"></small></span><span class="chev"></span></button>' +
    '<div class="collapse"><div class="collapse-inner" inert></div></div>';
  const ivInner = ivBox.querySelector('.collapse-inner');
  const ivSubs = ['sec', 'min', 'mid', 'hour'].map((k) => {
    const g = document.createElement('div');
    g.className = 'sub';
    g.innerHTML = '<div class="label"><b></b></div><div class="segwrap"></div>';
    g.querySelector('b').textContent = O[k].title;
    ivInner.append(g);
    return { key: k, seg: g.lastElementChild };
  });
  ivBox.querySelector('.disclose').onclick = () => {
    const open = !ivBox.classList.contains('open');
    ivBox.classList.toggle('open', open);
    ivBox.querySelector('.disclose').setAttribute('aria-expanded', String(open));
    ivInner.inert = !open;
  };
  list.append(simple[0].g, ivBox, simple[1].g, simple[2].g, simple[3].g);

  function renderOptions() {
    simple.forEach(({ key, g, seg }) => {
      g.hidden = O[key].when ? !O[key].when() : false;
      segment(seg, key);
    });
    ivSubs.forEach(({ key, seg }) => segment(seg, key));
    $('ivSummary').textContent = ['sec', 'min', 'mid', 'hour'].map(label).join(' · ');
  }

  /* ---------- Target input: clock wheels / duration buttons ---------- */
  const humanDur = (t) => {
    const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
    return [h && `${h} 時`, m && `${m} 分`, s && `${s} 秒`].filter(Boolean).join(' ');
  };
  function renderDur() {
    const b = $('durTotal');
    b.textContent = durTotal ? humanDur(durTotal) : '尚未設定';
    b.classList.toggle('empty', !durTotal);
    $('durClear').hidden = !durTotal;
    tick();
  }
  const CHIPS = [[10, '10 秒'], [30, '30 秒'], [60, '1 分'], [180, '3 分'], [300, '5 分'], [600, '10 分'], [900, '15 分'], [1800, '30 分']];
  $('chips').replaceChildren(...CHIPS.map(([sec, text]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = '+' + text;
    b.setAttribute('aria-label', `增加 ${text}`);
    b.onclick = () => { durTotal = Math.min(MAX_DUR, durTotal + sec); buzz(6); renderDur(); };
    return b;
  }));
  $('durClear').onclick = () => { durTotal = 0; renderDur(); };

  function renderMode() {
    [...$('modeSeg').children].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === cfg.mode)));
    if (cfg.mode === 'clock' && !clockTouched) { clockToNow(); syncClock(); }
    $('wClock').hidden = cfg.mode !== 'clock';
    $('durBox').hidden = cfg.mode !== 'dur';
    tick();
  }
  [...$('modeSeg').children].forEach((b) => { b.onclick = () => { cfg.mode = b.dataset.v; save(); renderMode(); }; });

  const IH = 44;
  const SEP = { sep: true };
  function clockCols() {
    const mins = { n: 60, label: p2, get: () => clockPick[1], set: (i) => { clockPick[1] = i; } };
    if (cfg.h24 === '24') {
      return [{ n: 24, label: p2, get: () => clockPick[0], set: (i) => { clockPick[0] = i; } }, SEP, mins];
    }
    const pm = () => (clockPick[0] >= 12 ? 1 : 0);
    return [
      { n: 2, label: (i) => ['上午', '下午'][i], wide: true, get: pm, set: (i) => { clockPick[0] = (clockPick[0] % 12) + 12 * i; } },
      { n: 12, label: (i) => String(i + 1), get: () => (clockPick[0] % 12 || 12) - 1, set: (i) => { clockPick[0] = ((i + 1) % 12) + 12 * pm(); } },
      SEP, mins,
    ];
  }
  let syncing = false, colEls = [];
  const mark = (col, idx) => { col._sel?.classList.remove('sel'); col._sel = col.children[idx]; col._sel?.classList.add('sel'); };
  function buildClock() {
    const host = $('wClock');
    host.replaceChildren();
    colEls = [];
    clockCols().forEach((c) => {
      if (c.sep) { const d = document.createElement('div'); d.className = 'sep'; d.textContent = ':'; host.append(d); return; }
      const col = document.createElement('div');
      col.className = 'col' + (c.wide ? ' wide' : ''); col.tabIndex = 0; col._idx = -1; col._c = c;
      const frag = document.createDocumentFragment();
      for (let i = 0; i < c.n; i++) {
        const o = document.createElement('div');
        o.className = 'opt'; o.textContent = c.label(i);
        frag.append(o);
      }
      col.append(frag);
      col.addEventListener('scroll', () => {
        const idx = clamp(Math.round(col.scrollTop / IH), 0, c.n - 1);
        if (idx !== col._idx) {
          col._idx = idx; mark(col, idx); buzz(4);
          c.set(idx); if (!syncing) clockTouched = true;
          tick();
        }
      }, { passive: true });
      col.addEventListener('click', (e) => {
        const o = e.target.closest('.opt');
        if (o) col.scrollTo({ top: [...col.children].indexOf(o) * IH, behavior: 'smooth' });
      });
      host.append(col); colEls.push(col);
    });
    syncClock();
  }
  function syncClock() {
    syncing = true;
    colEls.forEach((col) => { col._idx = col._c.get(); col.scrollTop = col._idx * IH; mark(col, col._idx); });
    setTimeout(() => { syncing = false; }, 200);
  }

  // 12 / 24 hour toggle
  function renderHourFormat() {
    const seg = $('hSeg');
    seg.replaceChildren(...[['24', '24 小時'], ['12', '12 小時']].map(([v, text]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = text; b.setAttribute('aria-pressed', String(cfg.h24 === v));
      b.onclick = () => { cfg.h24 = v; save(); renderHourFormat(); buildClock(); tick(); };
      return b;
    }));
  }

  /* ---------- Voice ----------
     Every announcement is pre-scheduled on the Web Audio clock, which runs on the audio thread:
     it keeps firing on time even when the page is minimised and its timers are throttled. */
  const D = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
  const zh = (n) => n < 10 ? D[n] : n < 20 ? '十' + D[n - 10] : D[Math.floor(n / 10)] + '十' + D[n % 10];
  const u = (n) => (n === 2 ? '兩' : zh(n));

  let ctx = null, gen = 0, lastEnd = 0, base = { audio: 0, wall: 0 };
  const sources = new Set();
  let windows = [];                                 // wall-clock spans in which an announcement is audible: the podcast steps aside
  const bufs = new Map();                          // clip name -> AudioBuffer
  const loading = new Map();
  let fallbackQ = [];                              // events whose clips are unavailable: spoken by tick() via browser speech

  function applyAudioSession() {                   // transient plays on top of music/podcasts; playback takes the audio over
    try { if (navigator.audioSession) navigator.audioSession.type = cfg.mix; } catch {}
  }
  function audioCtx() {
    try {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        ctx.onstatechange = () => { if (ctx && ctx.state === 'running') showFix(false); };
      }
      if (ctx.state !== 'running') ctx.resume();
    } catch {}
    return ctx;
  }
  function loadClip(name) {
    if (bufs.has(name)) return Promise.resolve(bufs.get(name));
    if (!loading.has(name)) {
      loading.set(name, fetch(`audio/${name}.mp3`)
        .then((r) => (r.ok ? r.arrayBuffer() : Promise.reject()))
        .then((b) => new Promise((ok, no) => audioCtx().decodeAudioData(b, ok, no)))
        .then((buf) => { bufs.set(name, buf); return buf; })
        .catch(() => null)
        .finally(() => loading.delete(name)));
    }
    return loading.get(name);
  }
  function stopAll() {
    gen++; lastEnd = 0; fallbackQ = []; windows = []; base = { audio: 0, wall: 0 };   // base.wall = 0 pauses the drift check
    sources.forEach((s) => { s.onended = null; try { s.stop(); } catch {} });
    sources.clear();
    try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch {}
  }

  let keepAlive = null;       // silent loop: keeps the audio session (and the page) alive while minimised
  function unlockAudio() {
    applyAudioSession();
    audioCtx();
    if (keepAlive) { keepAlive.play().catch(() => {}); return; }
    try {
      const n = 8000, v = new DataView(new ArrayBuffer(44 + n));
      const w = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
      w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true);
      v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true);
      v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
      w(36, 'data'); v.setUint32(40, n, true);
      for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
      keepAlive = new Audio(URL.createObjectURL(new Blob([v], { type: 'audio/wav' })));
      keepAlive.loop = true; keepAlive.play().catch(() => {});
      keepAlive.addEventListener('pause', () => { if (!document.hidden) recoverAudio(); });   // another app took the audio
    } catch {}
  }

  /* ---------- Interruptions (a podcast starts, a call comes in, Siri...) ---------- */
  const active = () => (st === 'run' || st === 'over') && !paused;
  const showFix = (on) => $('fix').classList.toggle('show', on);
  const drifted = (now) => base.wall && Math.abs(ctx.currentTime - (base.audio + (now - base.wall) / 1000)) > 0.4;
  async function recoverAudio() {
    if (!active()) return;
    audioCtx();                                    // try to resume without a tap
    if (keepAlive) keepAlive.play().catch(() => {});
    await new Promise((ok) => setTimeout(ok, 400));
    if (ctx && ctx.state === 'running') {
      if (drifted(Date.now()) || !sources.size) { stopAll(); scheduleAhead(); }   // the audio clock stood still: rebuild the schedule
      showFix(false);
    } else showFix(true);                          // iOS may insist on a tap
  }
  $('fixBtn').onclick = async () => {
    unlockAudio();                                 // inside the tap
    await new Promise((ok) => setTimeout(ok, 250));
    if (ctx && ctx.state !== 'running') {          // still stuck: start over with a fresh audio context
      try { await ctx.close(); } catch {}
      ctx = null; audioCtx();
      rebuildPod();                                // the podcast was wired to the old context
      await new Promise((ok) => setTimeout(ok, 250));
    }
    stopAll(); scheduleAhead();
    showFix(!(ctx && ctx.state === 'running'));
  };
  function speakFallback(text) {
    try {
      const synth = window.speechSynthesis;
      if (!synth) return;
      synth.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      ut.lang = 'zh-TW'; ut.rate = 1.05;
      const v = synth.getVoices().find((x) => /zh[-_]TW/i.test(x.lang)) || synth.getVoices().find((x) => /^zh/i.test(x.lang));
      if (v) ut.voice = v;
      synth.speak(ut);
    } catch {}
  }

  const addFallback = (evts) => { fallbackQ.push(...evts); fallbackQ.sort((a, b) => a.at - b.at); };

  // evts: [{ at: epoch ms, p: { clips, text } }] -> scheduled on the audio clock
  async function schedule(evts) {
    evts = evts.filter((e) => e && e.p).sort((a, b) => a.at - b.at);
    if (!evts.length) return;
    const mine = gen;
    await Promise.all([...new Set(evts.flatMap((e) => e.p.clips))].map(loadClip));
    if (mine !== gen) return;                      // cancelled (paused / reset) while loading
    const wall = Date.now();
    if (!ctx) { addFallback(evts); return; }
    const a0 = ctx.currentTime;
    base = { audio: a0, wall };
    evts.forEach((e) => {
      if (e.at < wall - 300) return;               // already past
      const list = e.p.clips.map((c) => bufs.get(c));
      if (list.some((b) => !b)) { addFallback([e]); return; }
      let at = Math.max(a0 + (e.at - wall) / 1000, lastEnd, a0 + 0.01);   // never overlap the previous clip
      const startAt = at;
      list.forEach((b) => {
        const src = ctx.createBufferSource();
        src.buffer = b; src.connect(ctx.destination); src.start(at);
        at += b.duration + 0.03;
        sources.add(src); src.onended = () => sources.delete(src);
      });
      windows.push({ from: wall + (startAt - a0) * 1000 - 400, to: wall + (at - a0) * 1000 + 300 });
      lastEnd = at;
    });
  }

  // 「剩餘…」 / 「超過…」: <1 min in seconds, <1 h in minutes, otherwise hours + minutes.
  function phrase(sec, over) {
    const s = over ? Math.floor(sec) : Math.round(sec);
    const pre = over ? '超過' : '剩餘';
    const k = over ? 'o' : '';
    if (s < 1) return null;
    if (s < 60) return { clips: [`${k}s${s}`], text: `${pre}${u(s)}秒` };
    const M = over ? Math.floor(s / 60) : Math.round(s / 60);
    const h = Math.floor(M / 60), m = M % 60;
    if (!h) return { clips: [`${k}m${m}`], text: `${pre}${u(m)}分鐘` };
    if (h > 24) return null;
    return { clips: [`${k}h${h}`, ...(m ? [`mm${m}`] : [])], text: `${pre}${u(h)}小時${m ? u(m) + '分鐘' : ''}` };
  }
  // The opening announcement is exact: minutes and seconds under an hour.
  function startPhrase(R0) {
    const s = Math.round(R0);
    if (s < 60) return phrase(s, false);
    const M = Math.floor(s / 60), r = s % 60;
    if (M >= 60) return phrase(s, false);
    return { clips: [`m${M}`, ...(r ? [`ss${r}`] : [])], text: `剩餘${u(M)}分鐘${r ? u(r) + '秒' : ''}` };
  }
  const countPhrase = (n) => ({ clips: [`n${n}`], text: zh(n) });
  const endPhrase = () => ({ clips: ['timeup'], text: '時間到' });

  /* ---------- Clock + schedule ---------- */
  // Spelled out with units so it can't be mistaken for a clock time: 23 分 59 秒
  function fmtDiff(t) {
    t = Math.max(0, Math.floor(t));
    const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
    const parts = [];
    if (h) parts.push([h, '時']);
    if (h || m) parts.push([parts.length ? p2(m) : m, '分']);
    parts.push([parts.length ? p2(s) : s, '秒']);
    return { html: parts.map(([n, u2]) => `${n}<i>${u2}</i>`).join(''), long: h > 0 };
  }
  // clock times honour the 12 / 24 hour setting
  function clockHTML(d, secs) {
    const hh = d.getHours();
    const tail = `:${p2(d.getMinutes())}${secs ? ':' + p2(d.getSeconds()) : ''}`;
    if (cfg.h24 === '24') return p2(hh) + tail;
    return `<i class="ap">${hh >= 12 ? '下午' : '上午'}</i>${hh % 12 || 12}${tail}`;
  }
  const setHTML = (el, h) => { if (el.dataset.h !== h) { el.innerHTML = h; el.dataset.h = h; } };
  const dayStart = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  function dayLabel(target, now) {
    const n = Math.round((dayStart(new Date(target)) - dayStart(new Date(now))) / 86400000);
    return n === 0 ? '' : n === 1 ? '明天 ' : n === 2 ? '後天 ' : `${n} 天後 `;
  }
  function targetFor(now) {
    if (cfg.mode === 'dur') return now + durTotal * 1000;
    const d = new Date(now);
    d.setHours(clockPick[0], clockPick[1], 0, 0);
    return d.getTime() <= now ? d.getTime() + 86400000 : d.getTime();
  }

  function buildMarks(R0) {
    const T = cfg.count, out = [];
    const ranges = [
      { I: cfg.hour, has: (v) => v > 3600 },
      { I: cfg.mid,  has: (v) => v > 600 && v <= 3600 },
      { I: cfg.min,  has: (v) => v >= 60 && v <= 600 },
      { I: cfg.sec,  has: (v) => v > 0 && v < 60 },
    ];
    ranges.forEach(({ I, has }) => {
      if (!I) return;
      for (let v = I; v < R0 - 0.5; v += I) if (has(v) && v > T) out.push({ t: v, type: 'report' });
    });
    for (let k = T; k >= 1; k--) if (k < R0 - 0.5) out.push({ t: k, type: 'count' });
    out.push({ t: 0, type: 'end' });
    return out.sort((a, b) => b.t - a.t);
  }
  const markPhrase = (m) => m.type === 'report' ? phrase(m.t, false) : m.type === 'count' ? countPhrase(m.t) : endPhrase();

  /* ---------- State ---------- */
  let st = 'idle';                 // idle | run | over | done
  let target = 0, total = 1, paused = false, pausedMs = 0;
  let stuckSince = 0;
  let marks = [], overGen = 0;     // overGen = how many 「超過」 reports are already scheduled

  const runEvents = () => marks.map((m) => ({ at: target - m.t * 1000, p: markPhrase(m) }));
  const overEvents = (from, to) => {
    const out = [];
    for (let k = from; k <= to; k++) out.push({ at: target + k * cfg.overIv * 1000, p: phrase(k * cfg.overIv, true) });
    return out.filter((e) => e.p);
  };
  // everything that is still ahead of us, in two stages so the next announcement is never starved by decoding
  function scheduleAhead() {
    const now = Date.now();
    const evts = [...runEvents(), ...(cfg.cont === 'say' ? overEvents(1, overGen) : [])].filter((e) => e.at > now + 30);
    const near = evts.filter((e) => e.at < now + 20000), far = evts.filter((e) => e.at >= now + 20000);
    schedule(near).then(() => schedule(far));
  }

  function start() {
    unlockAudio();
    stopAll();
    const t0 = Date.now();
    target = targetFor(t0);
    const R0 = (target - t0) / 1000;
    total = Math.max(1, R0);
    marks = buildMarks(R0); paused = false;
    overGen = cfg.cont === 'say' ? 240 : 0;
    st = 'run';
    schedule([{ at: t0, p: startPhrase(R0) }]);
    scheduleAhead();
    setUI(); tick();
  }
  function finish() { stopAll(); st = 'idle'; paused = false; setUI(); tick(); }
  function togglePause() {
    const t = Date.now();
    if (!paused) { pausedMs = target - t; paused = true; stopAll(); }
    else { target = t + pausedMs; paused = false; unlockAudio(); scheduleAhead(); }
    setUI(); tick();
  }

  function tick() {
    const now = Date.now();
    setHTML(els.nowT, clockHTML(new Date(now), false));
    let tgt = target;
    if (st === 'idle') tgt = targetFor(now);
    const R = paused ? pausedMs / 1000 : (tgt - now) / 1000;
    duckPod(now);

    if (st === 'run' && !paused && R <= 0.03) {
      buzz([120, 80, 120]);
      st = cfg.cont === 'stop' ? 'done' : 'over';
      setUI();
    }
    if ((st === 'run' || st === 'over') && !paused) {
      // keep the audio clock honest
      if (ctx) {
        if (ctx.state !== 'running') {
          ctx.resume();
          if (!document.hidden) { stuckSince ||= now; if (now - stuckSince > 1500) showFix(true); }
        } else {
          stuckSince = 0;
          if (base.wall && now - base.wall > 5000 && sources.size && drifted(now)) { stopAll(); scheduleAhead(); }
        }
      }
      // refill 「超過」 reports while the page is in view
      if (cfg.cont === 'say' && target + overGen * cfg.overIv * 1000 < now + 30 * 60000) {
        const from = overGen + 1; overGen += 120;
        schedule(overEvents(from, overGen));
      }
      // browser-speech fallback for any announcement without a recorded clip
      while (fallbackQ.length && fallbackQ[0].at <= now) { const e = fallbackQ.shift(); speakFallback(e.p.text); }
    }
    render(R, tgt, now);
  }

  const setText = (el, s) => { if (el.textContent !== s) el.textContent = s; };

  function render(R, tgt, now) {
    const dur = cfg.mode === 'dur';
    const emptyDur = st === 'idle' && dur && !durTotal;
    setHTML(els.tgtT, emptyDur ? '--:--:--' : clockHTML(new Date(tgt), dur));
    const day = emptyDur ? '' : dayLabel(tgt, now).trim();
    setText(els.tgtLabel, '目標時間' + (day ? ` · ${day}` : ''));
    $('lineDiff').classList.toggle('hero', dur);      // countdown mode: the difference is the hero
    $('lineTgt').classList.toggle('hero', !dur);      // clock mode: the target is

    let accent = 'idle', phase, diff, note = ' ';
    if (st === 'idle') {
      phase = dur ? '倒數時間' : '距離目標';
      diff = fmtDiff(Math.ceil(R));
      els.hint.textContent = '';
    } else if (st === 'run') {
      accent = 'run'; phase = paused ? '已暫停' : '剩餘時間';
      diff = fmtDiff(Math.ceil(R));
      note = `共 ${humanDur(Math.round(total))}`;
    } else if (st === 'over') {
      accent = 'over'; phase = '已超過'; diff = fmtDiff(-R);
      note = cfg.cont === 'say' ? '持續報時中' : '持續計時中';
    } else {
      accent = 'done'; phase = '時間到'; diff = fmtDiff(0);
    }
    if (!dur) note = ' ';
    setText(els.phase, phase); setText(els.note, note);
    if (els.time.dataset.h !== diff.html) { els.time.innerHTML = diff.html; els.time.dataset.h = diff.html; }
    els.time.classList.toggle('long', diff.long);
    root.style.setProperty('--accent', { idle: 'var(--blue)', run: 'var(--green)', over: 'var(--orange)', done: 'var(--red)' }[accent]);
    els.main.disabled = st === 'idle' && dur && !durTotal;
  }

  function setUI() {
    const busy = st === 'run' || st === 'over';
    els.setup.classList.toggle('locked', busy);
    els.opts.classList.toggle('locked', busy);
    els.sec.hidden = !(st === 'run' && cfg.mode === 'dur');
    els.main.textContent =
      st === 'idle' ? '開始' :
      st === 'done' ? '重設' :
      st === 'over' ? '結束' :
      cfg.mode === 'dur' ? (paused ? '繼續' : '暫停') : '結束';
    syncWake();
  }
  els.main.onclick = () => {
    if (st === 'idle') start();
    else if (st === 'done' || st === 'over') finish();
    else if (cfg.mode === 'dur') togglePause();
    else finish();
  };
  els.sec.onclick = finish;
  document.addEventListener('keydown', (e) => { if (e.code === 'Space' && !els.main.disabled) { e.preventDefault(); els.main.click(); } });

  /* ---------- Keep the screen awake while counting ---------- */
  let wake = null;
  async function syncWake() {
    const want = (st === 'run' || st === 'over') && !paused;
    try {
      if (want && !wake && navigator.wakeLock && !document.hidden) {
        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', () => { wake = null; });
      } else if (!want && wake) { await wake.release(); wake = null; }
    } catch { wake = null; }
  }
  window.addEventListener('pageshow', () => { if (!document.hidden) recoverAudio(); });
  window.addEventListener('focus', () => recoverAudio());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    syncWake();
    recoverAudio();
    if (st === 'idle' && cfg.mode === 'clock' && !clockTouched) { clockToNow(); syncClock(); }
    tick();
  });

  /* ---------- Podcast ----------
     Played by this page itself, so it shares one audio session with the announcements:
     both keep going in the background, and the podcast just steps aside while a phrase is spoken. */
  let pod = null, podGain = null, podNode = null;   // one <audio> per episode (a media element can be wired to Web Audio only once)
  const PKEY = 'time-announcer-pod-v1';
  const ps = { recent: [], cur: null, rate: 1 };
  try { Object.assign(ps, JSON.parse(localStorage.getItem(PKEY) || '{}')); } catch {}
  const savePod = () => { try { localStorage.setItem(PKEY, JSON.stringify(ps)); } catch {} };
  let podHeld = false;                              // true while WE paused it for an announcement
  const FADE_OUT = 0.3, FADE_IN = 0.6;

  // Fade the podcast out, hold it paused while a phrase is spoken, then fade it back in.
  function duckPod(now) {
    if (!pod || !pod.src) return;
    windows = windows.filter((w) => w.to > now - 1000);
    const inside = windows.some((w) => now >= w.from && now <= w.to);
    if (inside && !pod.paused && !podHeld) {
      podHeld = true;
      if (podGain && ctx) {
        const t = ctx.currentTime, g = podGain.gain;
        g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0.0001, t + FADE_OUT);
        const mine = pod;
        setTimeout(() => { if (podHeld && pod === mine) mine.pause(); }, FADE_OUT * 1000 + 30);
      } else pod.pause();                           // no gain node (host without CORS): just pause
    } else if (!inside && podHeld) {
      podHeld = false;
      pod.play().catch(() => {});
      if (podGain && ctx) {
        const t = ctx.currentTime, g = podGain.gain;
        g.cancelScheduledValues(t); g.setValueAtTime(0.0001, t); g.linearRampToValueAtTime(1, t + FADE_IN);
        const mine = pod;                           // safety net: never leave the podcast stuck at silence
        setTimeout(() => { if (!podHeld && pod === mine && podGain && ctx) { const n = ctx.currentTime; podGain.gain.cancelScheduledValues(n); podGain.gain.setValueAtTime(1, n); } }, (FADE_IN + 0.25) * 1000);
      }
    }
  }
  function wirePod(a) {                             // only possible when the host allows CORS; otherwise the sound would be muted
    if (pod !== a) return;
    const c = audioCtx();
    if (!c) return;
    try {
      podNode = c.createMediaElementSource(a); podGain = c.createGain();
      podNode.connect(podGain); podGain.connect(c.destination);
    } catch { podGain = null; podNode = null; }
  }
  const corsHosts = new Map();                      // origin -> does the audio host allow CORS (probed when a show is opened)
  const originOf = (u) => { try { return new URL(u).origin; } catch { return ''; } };
  async function probeCors(url) {
    const o = originOf(url);
    if (!o || corsHosts.has(o)) return;
    try { await fetch(url, { method: 'HEAD', mode: 'cors' }); corsHosts.set(o, true); } catch { corsHosts.set(o, false); }
  }

  const API = 'https://itunes.apple.com';
  const art = (u, n = 200) => (u || '').replace(/\d+x\d+(bb)?\.(jpg|png)/, `${n}x${n}bb.$2`);
  const mmss = (t) => { t = Math.max(0, Math.floor(t || 0)); const h = Math.floor(t / 3600); return (h ? `${h}:${p2(Math.floor(t / 60) % 60)}` : `${Math.floor(t / 60)}`) + ':' + p2(t % 60); };
  const img = (src) => { const i = document.createElement('img'); i.alt = ''; i.loading = 'lazy'; i.src = src || ''; i.onerror = () => { i.style.visibility = 'hidden'; }; return i; };
  const $list = $('podList');

  function note(text) { $list.replaceChildren(Object.assign(document.createElement('p'), { className: 'pnote', textContent: text })); }
  function row(src, title, sub, onClick, cls = '') {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'prow ' + cls;
    const t = document.createElement('div'); t.className = 't';
    const tb = document.createElement('b'); tb.textContent = title;
    const ts = document.createElement('small'); ts.textContent = sub;
    t.append(tb, ts); b.append(img(src), t);
    b.onclick = onClick;
    return b;
  }

  async function search(q) {
    q = q.trim();
    if (!q) return;
    $('podHead').hidden = true; note('搜尋中…');
    try {
      const r = await fetch(`${API}/search?term=${encodeURIComponent(q)}&media=podcast&country=TW&limit=15`);
      const d = await r.json();
      if (!d.results.length) return note('找不到節目，換個關鍵字試試');
      $list.replaceChildren(...d.results.map((x) => row(art(x.artworkUrl100), x.collectionName, x.artistName,
        () => openShow({ id: x.collectionId, name: x.collectionName, art: art(x.artworkUrl100) }))));
    } catch { note('搜尋失敗，請確認網路後再試'); }
  }

  async function openShow(show) {
    $('podHead').hidden = false; $('podShow').textContent = show.name;
    note('載入單集…');
    try {
      const r = await fetch(`${API}/lookup?id=${show.id}&entity=podcastEpisode&limit=40&country=TW`);
      const d = await r.json();
      const eps = d.results.filter((x) => x.kind === 'podcast-episode' && x.episodeUrl);
      if (!eps.length) return note('這個節目沒有可以播放的單集');
      probeCors(eps[0].episodeUrl);
      $list.replaceChildren(...eps.map((e) => {
        const date = new Date(e.releaseDate);
        const meta = `${date.getMonth() + 1}/${date.getDate()}` + (e.trackTimeMillis ? ` · ${Math.round(e.trackTimeMillis / 60000)} 分` : '');
        const ep = { title: e.trackName, url: e.episodeUrl, art: art(e.artworkUrl160 || show.art) };
        return row(ep.art || show.art, e.trackName, meta, () => playEpisode(show, ep, 0),
                   ps.cur && ps.cur.ep.url === ep.url ? 'now' : '');
      }));
    } catch { note('載入失敗，請確認網路後再試'); }
  }
  $('podBack').onclick = () => { $('podHead').hidden = true; $list.replaceChildren(); };
  $('podForm').onsubmit = (e) => { e.preventDefault(); search($('podQ').value); $('podQ').blur(); };

  function renderRecent() {
    $('podRecent').replaceChildren(...ps.recent.map((sh) => {
      const b = document.createElement('button');
      b.type = 'button';
      const sp = document.createElement('span'); sp.textContent = sh.name;
      b.append(img(sh.art), sp);
      b.onclick = () => openShow(sh);
      return b;
    }));
  }

  function makePod(url, pos, autoplay, cors) {
    if (pod) { const old = pod; pod = null; old.pause(); old.removeAttribute('src'); old.load(); }
    podHeld = false; podGain = null; podNode = null;
    const a = new Audio();
    a.preload = autoplay ? 'auto' : 'metadata'; a.playsInline = true;
    if (cors) a.crossOrigin = 'anonymous';
    a.src = url; a.playbackRate = ps.rate;
    pod = a; bindPod(a);
    a.addEventListener('loadedmetadata', () => { if (pos) a.currentTime = pos; if (cors) wirePod(a); }, { once: true });
    // the host refused a CORS request: play it plainly, without fades
    a.addEventListener('error', () => { if (cors && pod === a && !a.duration) { corsHosts.set(originOf(url), false); makePod(url, pos, autoplay, false); } }, { once: true });
    if (autoplay) a.play().catch(() => {});
    syncPlayer();
  }
  function playEpisode(show, ep, pos) {
    unlockAudio();                                  // also warms the audio context inside the tap
    ps.cur = { show, ep, pos };
    ps.recent = [show, ...ps.recent.filter((x) => x.id !== show.id)].slice(0, 6);
    savePod(); renderRecent();
    makePod(ep.url, pos, true, corsHosts.get(originOf(ep.url)) !== false);
    showPlayer();
    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: ep.title, artist: show.name,
          artwork: [{ src: art(ep.art || show.art, 512), sizes: '512x512' }] });
      } catch {}
    }
  }
  function restorePlayer() {                        // last episode comes back paused, at its position
    if (!ps.cur) return;
    makePod(ps.cur.ep.url, ps.cur.pos, false, corsHosts.get(originOf(ps.cur.ep.url)) !== false);
    showPlayer();
  }
  function rebuildPod() {                           // the audio context was replaced: re-wire the same episode
    if (!pod || !ps.cur) return;
    const playing = !pod.paused, pos = pod.currentTime;
    makePod(ps.cur.ep.url, pos, playing, corsHosts.get(originOf(ps.cur.ep.url)) !== false);
  }
  function showPlayer() {
    $('pp').hidden = false;
    $('ppArt').src = ps.cur.ep.art || ps.cur.show.art || '';
    $('ppTitle').textContent = ps.cur.ep.title;
    $('ppShow').textContent = ps.cur.show.name;
    $('ppRate').textContent = ps.rate + '×';
    syncPlayer();
  }

  const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  let seeking = false, lastSave = 0;
  function syncPlayer() {
    if (!pod) return;
    $('ppIcon').innerHTML = (pod.paused && !podHeld) ? PLAY : PAUSE;
    $('ppPlay').setAttribute('aria-label', pod.paused && !podHeld ? '播放' : '暫停');
    const d = isFinite(pod.duration) ? pod.duration : 0;
    $('ppSeek').max = d || 0; $('ppSeek').disabled = !d;
    if (!seeking) { $('ppSeek').value = pod.currentTime || 0; setText($('ppCur'), mmss(pod.currentTime)); }
    setText($('ppDur'), d ? mmss(d) : '--:--');
  }
  function bindPod(a) {
    ['timeupdate', 'play', 'pause', 'durationchange', 'loadedmetadata', 'ended'].forEach((ev) => a.addEventListener(ev, () => {
      if (pod !== a) return;
      syncPlayer();
      if (ps.cur && (ev !== 'timeupdate' || Date.now() - lastSave > 5000)) { ps.cur.pos = a.currentTime; lastSave = Date.now(); savePod(); }
    }));
  }
  $('ppPlay').onclick = () => {
    if (!ps.cur || !pod) return;
    if (podHeld) {                                  // pressed while an announcement was speaking: stay paused
      podHeld = false; pod.pause();
      if (podGain && ctx) { podGain.gain.cancelScheduledValues(ctx.currentTime); podGain.gain.setValueAtTime(1, ctx.currentTime); }
      return;
    }
    unlockAudio();
    if (pod.paused) pod.play().catch(() => {}); else pod.pause();
  };
  $('ppBack').onclick = () => { if (pod) pod.currentTime = Math.max(0, pod.currentTime - 15); };
  $('ppFwd').onclick = () => { if (pod) pod.currentTime = Math.min(pod.duration || Infinity, pod.currentTime + 30); };
  $('ppRate').onclick = () => {
    const rates = [1, 1.25, 1.5, 2];
    ps.rate = rates[(rates.indexOf(ps.rate) + 1) % rates.length] || 1;
    if (pod) pod.playbackRate = ps.rate;
    $('ppRate').textContent = ps.rate + '×'; savePod();
  };
  $('ppSeek').addEventListener('input', () => { seeking = true; setText($('ppCur'), mmss($('ppSeek').value)); });
  $('ppSeek').addEventListener('change', () => { if (pod) pod.currentTime = Number($('ppSeek').value); seeking = false; });
  if ('mediaSession' in navigator) {
    const h = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
    h('play', () => pod && pod.play()); h('pause', () => pod && pod.pause());
    h('seekbackward', () => { if (pod) pod.currentTime = Math.max(0, pod.currentTime - 15); });
    h('seekforward', () => { if (pod) pod.currentTime += 30; });
  }
  renderRecent(); restorePlayer();

  /* ---------- Init ---------- */
  renderOptions();
  renderDur();
  renderHourFormat();
  buildClock();
  renderMode();
  setUI();
  tick();
  setInterval(tick, 100);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
